quarkus.log.level=INFO
quarkus.log.category."fr.demo.souscription".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

quarkus.arc.remove-unused-beans=framework
quarkus.arc.fail-on-intercepted-private-method=true

quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.info-title=Horizon Catalogue Service
quarkus.smallrye-openapi.info-version=1.0.0
# Resilience contract published in the document itself (W4-T06). Mechanisms (Cache-Control,
# ETag, caller fault tolerance) come with plans 28 and 29: this only publishes the engagement.
quarkus.smallrye-openapi.info-description=Catalogue des placements Horizon (lecture seule). Contrat de resilience /v1 : disponibilite 99.9% (budget d'erreur ~43 min/mois) ; latence serveur p95 <= 25 ms, p99 <= 60 ms ; latence observee par l'appelant p95 <= 100 ms (mTLS et serialisation inclus) ; politique appelant : timeout 2 s, 1 retry (delai 100 ms, sur IOException), fallback documente (pire cas ~4,1 s), applicable aux GET seulement - ne jamais etendre a un autre verbe ; fraicheur des donnees : statique, Cache-Control + ETag sur les reponses /v1. Mode de defaillance convenu (CFG-005) : catalogue indisponible => la confirmation echoue proprement en 503 et ne persiste rien, aucun taux annuel en cache n'est servi. La tolerance aux pannes (timeout, retry, fallback) est entierement cote appelant : ce service n'en porte aucune.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD
quarkus.swagger-ui.always-include=false
quarkus.smallrye-openapi.auto-add-server=false

# Module identity and packaging (W3-T01, W3-T02) - replaces web.xml / struts-config.xml
quarkus.application.name=souscription-catalogue-service
quarkus.http.port=8443
quarkus.http.root-path=/
quarkus.package.jar.type=fast-jar
quarkus.http.body.delete-uploaded-files-on-end=true
# Overridable by environment variable (MicroProfile Config)
catalogue.cache.max-age-seconds=${CATALOGUE_CACHE_MAX_AGE:300}

# Container image (W3-T03) - replaces the legacy download-deploy-redeploy loop
# Opt-in: the image build requires a container runtime, so `mvn package` stays runnable
# without one. Enable with -Dquarkus.container-image.build=true.
quarkus.container-image.build=false
quarkus.container-image.group=financiere-horizon
quarkus.container-image.name=souscription-catalogue-service
quarkus.jib.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21-runtime:latest
# Memory sizing and hardening (W3-T07, NFG-003): the heap follows the cgroup limit, not the
# node memory. No credential of any kind is baked into the image or these properties.
quarkus.jib.jvm-arguments=-XX:MaxRAMPercentage=70,-XX:+ExitOnOutOfMemoryError,-Djava.io.tmpdir=/tmp,-Dfile.encoding=UTF-8

# Statelessness and graceful shutdown (W3-T05, AG-009, NFG-009)
# No session, no per-request state kept between requests: every replica is interchangeable.
# In-flight requests are drained before the process exits, so a rolling update loses no request.
quarkus.shutdown.timeout=30S
quarkus.http.so-reuse-port=true

# Explicit concurrency limits (W3-T06, NFG-010) - the legacy model was an implicit Tomcat
# thread pool configured nowhere. All four limits are environment-overridable.
quarkus.thread-pool.max-threads=${CATALOGUE_WORKER_MAX_THREADS:32}
quarkus.thread-pool.queue-size=${CATALOGUE_WORKER_QUEUE:512}
quarkus.http.limits.max-connections=${CATALOGUE_MAX_CONNECTIONS:1000}
quarkus.http.io-threads=${CATALOGUE_IO_THREADS:4}

# Distributed tracing (W5-T03, NFG-014, IG-005). The catalogue read is no longer in-process:
# it participates in the confirmation path (souscription-service -> catalogue) and in the
# navigation path (gateway -> catalogue), so the incoming W3C traceparent must be honoured.
quarkus.otel.sdk.disabled=false
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
# parentbased_traceidratio is required, not optional: the caller's sampling decision is
# respected, so a sampled confirmation trace is never truncated at this hop. always_on would
# saturate the collector on a high-traffic read endpoint, always_off would make incidents
# unanalysable.
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_SAMPLING_RATIO:0.1}
quarkus.otel.resource.attributes=service.name=souscription-catalogue-service,service.version=1.0.0
# Tests assert on spans captured in memory (TracePropagationTest): no OTLP export, and every
# root span sampled so the assertions are deterministic.
%test.quarkus.otel.traces.exporter=cdi
%test.quarkus.otel.traces.sampler.arg=1.0
# Short batch delay so the assertions do not wait the 5 s production schedule.
%test.quarkus.otel.bsp.schedule.delay=100ms
# Structured, correlated JSON logging (W5-T04, NFG-012). One JSON record per line, carrying
# the traceId/spanId produced by quarkus-opentelemetry above, so a log line can be joined to
# its trace. quarkus.log.console.format is therefore only used by the dev profile below.
quarkus.log.console.json=true
quarkus.log.console.json.enabled=true
quarkus.log.console.json.additional-field."service.name".value=souscription-catalogue-service
quarkus.log.console.json.additional-field."service.version".value=1.0.0
# Human-readable console in quarkus:dev; JSON would make the dev loop unreadable.
%dev.quarkus.log.console.json=false
%dev.quarkus.log.console.json.enabled=false
# Access log stays off: its default pattern would echo request headers (and therefore any
# authentication material) into the log stream. No header, no client certificate is logged.
quarkus.http.access-log.enabled=false

# End-to-end UTF-8 (W4-T02, CFG-009, TG-004) - third link of the chain after the compiler
# source encoding and -Dfile.encoding=UTF-8 in the image.
# Quarkus REST JSON responses are UTF-8 by default; make it explicit and tested.
quarkus.http.body.default-charset=UTF-8

# Health probes on a dedicated management interface (W5-T01, NFG-015). /q/health/live and
# /q/health/ready move off the application port 8443 so the orchestrator keeps probing them
# once mTLS is required on the business port (plan 26).
quarkus.management.enabled=true
quarkus.management.port=9000
# The OpenAPI document stays on the application port: it is part of the published API surface
# (W4-T06), not an operational endpoint, so enabling the management interface must not move it.
quarkus.smallrye-openapi.management.enabled=false

# Micrometer / Prometheus (W5-T02, NFG-001, NFG-013, IG-005). /q/metrics is served on the
# management port 9000 only, so the series are not reachable from the application perimeter.
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true

# Mutual TLS on the application port (W6-T01, CFG-006, IG-003, NFG-007). Every /v1 request must
# present a client certificate signed by the internal CA; no cleartext listener remains on 8443.
# The certificate material is mounted at /etc/tls from the Kubernetes object declared in
# deploy/deployment.yaml - never baked into the image, the POM or this file.
quarkus.http.insecure-requests=disabled
quarkus.http.ssl-port=8443
quarkus.http.ssl.certificate.files=${TLS_CERT_FILE:/etc/tls/tls.crt}
quarkus.http.ssl.certificate.key-files=${TLS_KEY_FILE:/etc/tls/tls.key}
quarkus.http.ssl.certificate.trust-store-file=${TLS_CA_FILE:/etc/tls/ca.crt}
quarkus.http.ssl.client-auth=required
# TLS 1.3 only (NFG-006): the JDK default list still allows TLS 1.2, so the negotiated version is
# pinned here instead of being left to the runtime defaults. All callers are internal services on
# Java 21 / recent TLS stacks; any exception must be recorded with the owning team.
quarkus.http.ssl.protocols=TLSv1.3
# The management port 9000 (probes, metrics) stays outside the mTLS perimeter, cluster-internal
# only (NetworkPolicy in plan 27). client-auth is deliberately NOT enabled on it; it is configured
# once above (quarkus.management.port).
# Tests and the dev loop run without the mounted certificate material: cleartext on the application port, no
# client certificate. The production perimeter above is unaffected.
%test.quarkus.http.insecure-requests=enabled
%test.quarkus.http.ssl.client-auth=none
%test.quarkus.http.ssl.certificate.files=
%test.quarkus.http.ssl.certificate.key-files=
%test.quarkus.http.ssl.certificate.trust-store-file=
%dev.quarkus.http.insecure-requests=enabled
%dev.quarkus.http.ssl.client-auth=none
%dev.quarkus.http.ssl.certificate.files=
%dev.quarkus.http.ssl.certificate.key-files=
%dev.quarkus.http.ssl.certificate.trust-store-file=
