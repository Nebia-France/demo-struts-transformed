# Cles de message de validation (W4-T01, W4-T02).
#
# Le service renvoie une cle de message, jamais un libelle francais : le rendu appartient a
# souscription-web (ERROR_VOCABULARY.md). Les valeurs ci-dessous sont donc les cles gelees du
# vocabulaire d'erreur, pas des phrases.
#
# Les deux verdicts de date du source restent distincts : une date dans le futur et une
# souscription reservee aux majeurs sont deux cles separees.
horizon.subscriber.birthDate.format=subscriber.birthDate.format
horizon.subscriber.birthDate.future=subscriber.birthDate.future
horizon.subscriber.minimumAge=subscriber.birthDate.minor
horizon.subscriber.noControlChars=subscriber.name.invalid
# Bornes de montant et de duree (W4-T03). Elles doivent rester egales aux contraintes CHECK de
# V1__subscriptions.sql et au verdict de souscription-simulation-service
# (AMOUNT_BOUNDARY_CONTRACT.md).
horizon.simulation.initialAmount.range=simulation.initialAmount.range
horizon.simulation.monthlyAmount.range=simulation.monthlyAmount.range
horizon.simulation.durationYears.range=simulation.durationYears.range
