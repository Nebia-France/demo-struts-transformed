# Le repertoire des scenarios est declare ici : cucumber.features prime sur tout autre
# selecteur de decouverte, et resout ../features depuis le repertoire du module.
# La porte par defaut (mvn clean test) reste exempte du moteur cucumber grace a
# <excludeJUnit5Engines>cucumber</excludeJUnit5Engines> sur maven-surefire-plugin ;
# seul le profil -Pcucumber (failsafe / CucumberSuiteIT) execute la collecte.
# W8-T04 : la suite est executee (dry-run=false) contre le service package et une base
# PostgreSQL reelle ; les scenarios realloues aux applications soeurs sont exclus par etiquette.
cucumber.features=../features
cucumber.glue=features.step_definitions
cucumber.plugin=pretty,html:target/cucumber-report.html
cucumber.execution.dry-run=false
cucumber.filter.tags=not @hors-perimetre-souscription-service
# Ce fichier masque celui de quarkus-junit5-config (un seul junit-platform.properties est lu) :
# ses deux cles sont reprises ici. Sans l'ordonnanceur Quarkus, les classes de test s'executent
# sans regroupement par profil et l'application est redemarree a chaque changement de profil
# (NFG-010 : duree de pipeline < 5 min).
junit.jupiter.extensions.autodetection.enabled=true
junit.jupiter.testclass.order.default=io.quarkus.test.config.QuarkusClassOrderer
