apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: souscription-catalogue-service
  labels: { app: souscription-catalogue-service }
spec:
  groups:
    - name: souscription-catalogue-service.slo
      # Minimal alert set backed by the published /v1 resilience contract (AG-013, IG-005):
      # availability 99.9% (error budget ~43 min/month) and server latency p95 <= 25 ms.
      # The `job` label is produced by the ServiceMonitor (deploy/servicemonitor.yaml), which
      # scrapes the `management` port of the souscription-catalogue-service Service.
      rules:
        # 1. Server p95 on /v1 above the published 25 ms budget.
        - alert: CatalogueV1LatencyP95Above25ms
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_server_requests_seconds_bucket{job="souscription-catalogue-service",uri=~"/v1.*"}[5m])
              )
            ) > 0.025
          for: 5m
          labels: { severity: warning, service: souscription-catalogue-service }
          annotations:
            summary: "Catalogue /v1 server p95 above the 25 ms contract"
            description: "p95 = {{ $value | humanizeDuration }} over 5 min, published budget p95 <= 25 ms."

        # 2. 5xx rate above 0.1% — the complement of the 99.9% availability engagement.
        - alert: CatalogueV1ServerErrorRateAbove01Percent
          expr: |
            sum(rate(http_server_requests_seconds_count{job="souscription-catalogue-service",uri=~"/v1.*",status=~"5.."}[5m]))
              /
            sum(rate(http_server_requests_seconds_count{job="souscription-catalogue-service",uri=~"/v1.*"}[5m]))
              > 0.001
          for: 5m
          labels: { severity: critical, service: souscription-catalogue-service }
          annotations:
            summary: "Catalogue /v1 5xx rate above 0.1%"
            description: "5xx ratio = {{ $value | humanizePercentage }}, availability engagement is 99.9%."

        # 3. Readiness DOWN for more than 1 minute. /q/health/ready is the probe used by the
        # readinessProbe in deploy/deployment.yaml; `up` reflects the management endpoint scrape.
        - alert: CatalogueReadinessDown
          expr: |
            min by (pod) (up{job="souscription-catalogue-service"}) == 0
            or on() absent(up{job="souscription-catalogue-service"})
          for: 1m
          labels: { severity: critical, service: souscription-catalogue-service }
          annotations:
            summary: "Catalogue instance not ready for more than 1 minute"
            description: "The management endpoint is unreachable or readiness is DOWN; traffic is being drained."

        # 4. 99.9% error-budget burn: fast burn (14.4x over 1 h) exhausts the ~43 min monthly
        # budget in about two days, which is what makes the engagement actionable.
        - alert: CatalogueErrorBudgetFastBurn
          expr: |
            (
              sum(rate(http_server_requests_seconds_count{job="souscription-catalogue-service",uri=~"/v1.*",status=~"5.."}[1h]))
                /
              sum(rate(http_server_requests_seconds_count{job="souscription-catalogue-service",uri=~"/v1.*"}[1h]))
            ) > (14.4 * 0.001)
          for: 2m
          labels: { severity: critical, service: souscription-catalogue-service }
          annotations:
            summary: "Catalogue 99.9% error budget burning at 14.4x"
            description: "At this rate the ~43 min monthly error budget is exhausted in ~2 days."
