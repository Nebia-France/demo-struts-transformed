# Cache policy resolved per URI so that every `add_header` lives in a single context.
# nginx does not inherit server-level `add_header` into a location that declares its own,
# which would silently drop the security headers on the cached locations.
map $uri $souscription_cache_control {
  # Unhashed entry documents. `no-store` keeps them revalidated on every visit, otherwise a
  # deployment is never picked up: index.html is what references the new hashed bundles and
  # version.json is what exposes the deployed release.
  default                                "no-store";
  "/index.html"                          "no-store";
  "/version.json"                        "no-store";
  # Content-hashed assets (angular.json production outputHashing: all). The filename changes
  # whenever the content changes, so the response can be cached for a year without revalidation.
  "~*\.(js|css|woff2|png|svg)$"          "public, max-age=31536000, immutable";
}

server {
  listen 8080;
  root /usr/share/nginx/html;

  # Precompressed variants produced by `scripts/precompress.mjs` at build time (.gz next to every
  # .js/.css). `gzip_static on` serves them verbatim; `gzip on` stays as the on-the-fly fallback
  # for files that have no precompressed variant on disk.
  gzip on;
  gzip_static on;

  # The exposed surface is the build output, /healthz and /version.json only. A directory path
  # must never be answered by a listing (W6-T06); it falls through to the SPA index.html.
  autoindex off;

  # Level 1: content-hashed immutable assets (outputHashing: all)
  # Level 2: unhashed entry documents (/index.html, /version.json, SPA fallback) -> no-store
  add_header Cache-Control $souscription_cache_control always;

  # Security headers formerly set by src/main/java/fr/demo/souscription/web/SecurityFilter.java.
  # Equivalent or stricter: only `script-src` moves from 'none' to 'self' because a SPA
  # executes its own hashed bundles. No unsafe- sources, no wildcard.
  # Angular inserts each component stylesheet as a <style> element at runtime; `style-src` admits
  # them through a per-response nonce ($request_id, 128 random bits), written into index.html by
  # the sub_filter below and read by Angular from the `ngCspNonce` attribute of <app-root>.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'nonce-$request_id'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ /index.html;
    # Per-response CSP nonce of the entry document (text/html only; index.html is no-store, so
    # a nonce is never replayed from a cache).
    sub_filter '__CSP_NONCE__' '$request_id';
    sub_filter_once off;
  }
}
