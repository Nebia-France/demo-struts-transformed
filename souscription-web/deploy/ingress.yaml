# Same-origin ingress (decision OD-004): the SPA and the API are served from one host,
# so no CORS configuration is required on souscription-gateway.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: souscription-web
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Mirror of the deploy/nginx.conf header set (SecurityFilter.java equivalent, plus HSTS)
    # so the headers are present whichever hop terminates the request. The
    # Content-Security-Policy is not mirrored: its `style-src` nonce is generated per response
    # by the souscription-web container (deploy/nginx.conf), and a static copy set here would
    # replace it and block the SPA's component styles. The gateway sets its own API policy
    # (contracts/security-policy.json).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: no-referrer";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  ingressClassName: nginx
  rules:
    - host: souscription.example.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: souscription-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: souscription-web
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: souscription-web
spec:
  selector:
    app: souscription-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
