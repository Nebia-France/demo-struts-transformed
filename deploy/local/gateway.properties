# Les clients 3.20 utilisent les magasins PKCS12 ; verification du nom DNS conservee.
quarkus.rest-client.catalogue.key-store=file:/pki/souscription-gateway.p12
quarkus.rest-client.catalogue.key-store-password=${LOCAL_STORE_PASSWORD}
quarkus.rest-client.catalogue.trust-store=file:/pki/truststore.p12
quarkus.rest-client.catalogue.trust-store-password=${LOCAL_STORE_PASSWORD}
quarkus.rest-client.simulation.key-store=file:/pki/souscription-gateway.p12
quarkus.rest-client.simulation.key-store-password=${LOCAL_STORE_PASSWORD}
quarkus.rest-client.simulation.trust-store=file:/pki/truststore.p12
quarkus.rest-client.simulation.trust-store-password=${LOCAL_STORE_PASSWORD}
