quarkus.application.name=souscription-service
quarkus.http.port=8080
quarkus.http.root-path=/
quarkus.default-locale=fr-FR
quarkus.native.enabled=false
quarkus.log.console.json=true
# UTF-8 / Europe/Paris determinism, previously carried by cargo.jvmargs and server.xml
quarkus.jib.jvm-arguments=-Dfile.encoding=UTF-8,-Duser.timezone=Europe/Paris,-XX:MaxRAMPercentage=75

# Limite de taille de requete, anciennement server.xml maxPostSize="16384"
quarkus.http.limits.max-body-size=16K

# Les schemas geles des corps de requete declarent additionalProperties: false : un champ
# inconnu doit etre refuse (400) et non ignore silencieusement.
quarkus.jackson.fail-on-unknown-properties=true
# Les dates voyagent en ISO-8601 (YYYY-MM-DD), jamais en horodatage numerique ni en format
# dependant de la locale : aucune forme de date locale ne fuit par la serialisation (W3-T07).
quarkus.jackson.write-dates-as-timestamps=false
%dev.quarkus.log.console.json=false
%test.quarkus.log.console.json=false
# Port de test aleatoire : chaque profil de test redemarre l'application, et un redemarrage dont
# le predecesseur n'a pas encore libere 8081 echoue sur « Port(s) already bound ». Le port fixe
# rendait la suite dependante de l'ordre de liberation des sockets par le systeme.
%test.quarkus.http.test-port=0

# Backend de journalisation (W0-T07) : JBoss Logger de Quarkus, sortie console JSON.
# Remplace la journalisation via le contexte web Struts et le binding slf4j-simple.
quarkus.log.level=INFO
# Niveau pilotable par environnement (W5-T01), DEBUG reste le defaut hors deploiement.
quarkus.log.category."fr.demo.souscription".level=${HORIZON_LOG_LEVEL:DEBUG}
quarkus.log.console.json.additional-field."service.name".value=souscription-service
quarkus.log.console.json.additional-field."service".value=souscription-service
quarkus.log.console.json.log-format=ecs
# Sans cette ligne, le formateur JSON n'ecrit pas le MDC : correlationId, traceId et spanId
# seraient configures mais absents de la sortie (cause la plus frequente d'un grep vert et de
# champs vides).
quarkus.log.console.json.fields.mdc.enabled=true
# Correlation (W5-T01) : correlationId, traceId et spanId sont portes par le MDC, pose par
# observability/CorrelationFilter et par l'extension OpenTelemetry. Le formateur JSON de
# Quarkus serialise le MDC de chaque enregistrement : aucune cle n'est exclue.

# Datasource PostgreSQL externalisee et poolee (W1-T01) : aucune URL, aucun identifiant
# et aucun mot de passe n'a de valeur par defaut (NFG-004), la configuration vient
# integralement de l'environnement. Ces trois cles sont limitees au profil prod : definies pour
# tous les profils, l'expression non resolue masquerait l'URL injectee par Dev Services en
# dev et en test (datasource desactivee "because its URL is not set").
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${HORIZON_DB_URL}
%prod.quarkus.datasource.username=${HORIZON_DB_USER}
%prod.quarkus.datasource.password=${HORIZON_DB_PASSWORD}
quarkus.datasource.jdbc.additional-jdbc-properties.sslmode=require
quarkus.hibernate-orm.database.default-schema=subscriptions
# Le schema est la propriete de Flyway : Hibernate ne genere ni ne valide le DDL.
quarkus.hibernate-orm.database.generation=none

# Flyway (W1-T03) : la migration versionnee db/migration/V1__subscriptions.sql est l'unique
# source du schema. En production la migration est une etape de pipeline controlee
# (NFG-019) et jamais un effet de bord du demarrage, d'ou migrate-at-start=false par defaut.
quarkus.flyway.locations=db/migration
quarkus.flyway.schemas=subscriptions
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.migrate-at-start=false
quarkus.flyway.validate-on-migrate=true
%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true

# Dev Services PostgreSQL pour les profils dev et test : la base est fournie par un
# conteneur jetable, les trois variables HORIZON_DB_* ne sont donc pas requises localement.
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=postgres:16-alpine
# En test, Dev Services est arme (etape 8 du plan 36) avec la meme image qu'en dev. Le pool
# reste inactif par defaut (cles ci-dessous) : les tests qui n'ont pas besoin de la base ne
# doivent pas exiger un daemon de conteneurs, et les tests de persistance l'arment via
# @TestProfile(PostgresDevServicesProfile).
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:16-alpine
# Datasource et unite de persistance inactives par defaut en test : avec SubscriptionEntity
# (W1-T04), un simple "jdbc=false" ferait echouer le demarrage des tests sans base.
# PostgresDevServicesProfile les reactive.
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.datasource.jdbc.additional-jdbc-properties.sslmode=disable
%test.quarkus.otel.sdk.disabled=true
# Echantillonnage force en test : le ratio de production (OTEL_SAMPLING_RATIO:0.1) rendrait
# toute assertion de correlation non deterministe (une execution verte ne prouverait rien).
# Le ratio de production reste inchange.
%test.quarkus.otel.traces.sampler=always_on
%test.quarkus.otel.traces.sampler.arg=1

# Pool Agroal (W1-T02) : dimensionnement et instrumentation. Cf. deploy/POOL_SIZING.md
# pour les seuils NFG-008 (p95 < 300 ms, 0 timeout d'acquisition) et NFG-013
# (max-size x replicas <= 80 % de max_connections).
quarkus.datasource.jdbc.min-size=${HORIZON_DB_POOL_MIN:2}
quarkus.datasource.jdbc.max-size=${HORIZON_DB_POOL_MAX:10}
quarkus.datasource.jdbc.acquisition-timeout=3S
quarkus.datasource.jdbc.leak-detection-interval=10S
quarkus.datasource.metrics.enabled=true

# Pool de threads worker (W6-T05). Les six operations REST sont marquees @Blocking : elles
# s'executent sur ce pool et jamais sur la boucle d'evenements. Le plafond est volontairement du
# meme ordre que quarkus.datasource.jdbc.max-size (ratio 2:1, cf. deploy/POOL_SIZING.md) :
# davantage de workers que de connexions ne produit pas de debit, seulement de l'attente
# d'acquisition comptee en timeouts NFG-008.
quarkus.thread-pool.max-threads=${HORIZON_WORKER_THREADS:20}

# Packaging OCI (W0-T05) : fast-jar + image durcie non-root.
# Le build d'image reste desactive par defaut (offline-safe) ; la pipeline CI
# surcharge avec -Dquarkus.container-image.build=true.
quarkus.package.jar.type=fast-jar
quarkus.container-image.group=horizon
quarkus.container-image.name=souscription-service
quarkus.container-image.build=false
# Base JRE 21 sans shell (W7-T05, remplacee au plan 41) : aucun shell ni gestionnaire de paquets
# dans l'image finale, alignee sur src/main/docker/Dockerfile.jvm. Construite au prealable sur le
# meme daemon depuis src/main/docker/Dockerfile.base-jre (paquets Wolfi, 0 finding HIGH/CRITICAL) ;
# la base distroless Debian portait des findings sans correctif amont. L'UID non-root est
# numerique (185).
quarkus.jib.base-jvm-image=docker://horizon/souscription-jre21-base:21
quarkus.jib.user=185

# Boucle de developpement (W0-T06) : quarkus:dev + Dev Services.
%dev.quarkus.http.port=8080
%dev.quarkus.live-reload.instrumentation=true

# Retention explicite du brouillon (W2-T05) : equivalence stricte avec le
# <session-timeout>20</session-timeout> de web.xml. Ne pas modifier cette valeur par defaut.
# La purge planifiee est metree par le compteur horizon.draft.purged (cf. deploy/DRAFT_ALERTS.md).
horizon.draft.retention=PT20M
horizon.draft.purge.cron=0 */5 * * * ?
# En test la purge n'est jamais declenchee par l'horloge : DraftRetentionJobTest invoque la
# methode directement, et les tests sans base ne doivent pas voir de tache planifiee.
%test.quarkus.scheduler.enabled=false

# Contrats consommes : les clients REST des plans 27-28 sont la seule implementation (plan 41,
# plus aucun stub local ni indicateur de repli). En test ils sont reellement exerces et les tests
# les bouchonnent (CatalogueStubServer, SimulationStubServer, derives des contrats geles).

# Client REST du catalogue (W6-T01). L'URL n'a aucune valeur par defaut hors test (NFG-004) :
# les adresses valides sont les serveurs internes au cluster en mTLS du contrat gele
# global/contracts/souscription-service-to-souscription-catalogue-service/openapi.yaml.
# Le materiel TLS client est pose par le plan 29.
# Le schema et le port sont fixes dans la cle (https / 8443) : seule l'hote interne du cluster
# vient de l'environnement. Une variable portant l'URL complete permettrait de livrer un
# http:// en clair par simple changement de configuration, ce que le plan 29 interdit.
quarkus.rest-client.catalogue.url=https://${HORIZON_CATALOGUE_HOST}:8443
quarkus.rest-client.catalogue.scope=jakarta.inject.Singleton
# Bouchon HTTP local des tests du client (CatalogueStubServer, port fixe).
%test.quarkus.rest-client.catalogue.url=http://localhost:18089

# Client REST de la simulation (W6-T02). Depuis le plan 28 le recalcul autoritaire de la
# confirmation est un appel distant ; il est emis avant l'ouverture de la transaction (NFG-009).
# L'URL n'a aucune valeur par defaut hors test (NFG-004) : les adresses valides sont les serveurs
# internes au cluster en mTLS du contrat gele
# global/contracts/souscription-service-to-souscription-simulation-service/openapi.yaml.
# Le materiel TLS client est pose par le plan 29.
# Meme forme que pour le catalogue : schema et port fixes, hote seul variabilise.
quarkus.rest-client.simulation.url=https://${HORIZON_SIMULATION_HOST}:8443
quarkus.rest-client.simulation.scope=jakarta.inject.Singleton
# Bouchon HTTP local des tests du client (SimulationStubServer, port fixe).
%test.quarkus.rest-client.simulation.url=http://localhost:18090

# mTLS de maillage (W6-T03). Une seule configuration TLS nommee « mesh » sert les deux clients
# sortants : elle presente le certificat de charge de travail
# spiffe://horizon-souscription/ns/horizon/sa/souscription-service et ne fait confiance qu'a
# l'autorite du cluster. Les trois references sont des variables d'environnement : aucun
# certificat, aucune cle et aucun magasin de cles n'existe dans le depot ni dans l'image,
# le materiel est monte par la plateforme et rotate automatiquement par la PKI du cluster.
#
# Les cles sont prefixees %prod : hors production (dev, test) les clients pointent sur des
# bouchons HTTP locaux et aucun materiel TLS n'est monte. Sans ce prefixe, le registre TLS de
# Quarkus resoudrait ${WORKLOAD_CERT} au demarrage de chaque test et echouerait sur une variable
# absente — l'exigence « aucune valeur par defaut » (NFG-004) interdisant de lui en donner une.
%prod.quarkus.rest-client.catalogue.tls-configuration-name=mesh
%prod.quarkus.rest-client.simulation.tls-configuration-name=mesh
%prod.quarkus.tls.mesh.key-store.pem.0.cert=${WORKLOAD_CERT}
%prod.quarkus.tls.mesh.key-store.pem.0.key=${WORKLOAD_KEY}
%prod.quarkus.tls.mesh.trust-store.pem.certs=${CLUSTER_CA}
# TLS 1.3 impose de part et d'autre par les security-policy.json des deux contrats consommes.
%prod.quarkus.tls.mesh.protocols=TLSv1.3
# L'identite du pair est verifiee contre le nom DNS interne du service appele : un certificat
# valide emis par la PKI du cluster mais presente par une autre charge de travail est refuse.
%prod.quarkus.tls.mesh.hostname-verification-algorithm=HTTPS

# Document OpenAPI /v1 publie (W3-T09) : expose sur /q/openapi et stocke a la construction
# dans target/openapi/ pour servir d'artefact de pipeline diffe contre le contrat gele
# global/contracts/souscription-gateway-to-souscription-service/openapi.yaml (NFG-019).
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.store-schema-directory=target/openapi
# Sans cette ligne, Quarkus remplace les serveurs declares par @OpenAPIDefinition par les adresses
# locales auto-detectees (http://localhost:8080) : un artefact publie avec une base localhost est
# recopie tel quel dans la configuration des consommateurs. Les seuls serveurs valides sont les
# adresses internes au cluster en mTLS (https://...:8443/v1) du contrat gele.
quarkus.smallrye-openapi.auto-add-server=false
mp.openapi.extensions.smallrye.info.title=Horizon Subscription Service Internal API
mp.openapi.extensions.smallrye.info.version=1.0.0
# Les serveurs du contrat gele. Declares aussi par @OpenAPIDefinition dans OpenApiConfiguration,
# mais la configuration est la source autoritative pour SmallRye : elle garantit que l'artefact
# publie porte bien les trois adresses internes au cluster, quelle que soit la facon dont le
# scanner traite l'annotation.
mp.openapi.servers=https://souscription-service.dev.svc.cluster.local:8443/v1,https://souscription-service.staging.svc.cluster.local:8443/v1,https://souscription-service.prod.svc.cluster.local:8443/v1
# Retire le prefixe /v1 des chemins du document publie : il est deja porte par l'URL de serveur,
# comme dans le contrat gele. Sans ce filtre, base + chemin designent /v1/v1/drafts.
mp.openapi.filter=fr.demo.souscription.api.VersionPrefixFilter

# Sondes de sante (W5-T02) : /q/health/started, /q/health/live et /q/health/ready, declarees et
# cablees par deploy/deployment.yaml. La source n'exposait aucun point de sante.
quarkus.smallrye-health.root-path=/q/health
# Metriques Prometheus (W5-T03) : la source n'exposait aucune metrique. Le registre expose le
# jeu par defaut (http_server_requests_seconds, jvm_*, agroal_*) et les cinq compteurs metier
# declares par observability/BusinessMetrics. Cf. deploy/OBSERVABILITY.md.
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true

# Tracage distribue (W5-T04) : propagation W3C traceparent en entree (souscription-gateway) et en
# sortie (clients REST), spans JDBC/Hibernate automatiques. L'echantillonnage de tete est un ratio
# herite du parent ; la conservation de 100 % des traces en erreur est assuree par le
# tail sampling du collecteur OTLP (mecanisme documente dans deploy/OBSERVABILITY.md).
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}
%dev.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
%dev.quarkus.otel.traces.exporter=${OTEL_TRACES_EXPORTER:none}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_SAMPLING_RATIO:0.1}
# En test, le SDK est desarme (ligne %test.quarkus.otel.sdk.disabled ci-dessus) : l'adresse du
# collecteur est fixee localement pour qu'aucun test n'exige la variable d'environnement.
%test.quarkus.otel.exporter.otlp.endpoint=http://localhost:4317

# Arret gracieux (W5-T05) : les requetes en vol sont drainees avant la fermeture du serveur, la
# ou le bootstrap servlet source coupait net a la destruction du contexte web. Valeur alignee sur le
# terminationGracePeriodSeconds du manifeste de deploiement.
quarkus.shutdown.timeout=30S

# En-tetes de securite pertinents pour une API JSON (W7-T03). Le SecurityFilter servlet de la
# source posait six en-tetes sur ses reponses HTML ; seuls ces trois ont un sens sur une reponse
# JSON et restent ici. Les trois autres concernent le document HTML ou la restriction de methodes
# et sont alloues a souscription-gateway / souscription-web : le tableau d'allocation des six
# en-tetes source est dans SECURITY_GATES.md. Pose par la couche HTTP, donc present sur 100 % des reponses /v1,
# y compris les corps application/problem+json des mappeurs d'erreur.
quarkus.http.header."Cache-Control".value=no-store
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer
