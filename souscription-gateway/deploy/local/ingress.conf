# Same-origin ingress of the local topology (docker-compose.dev.yml), mirroring the shared ingress
# of the cluster (OD-004): the SPA and the gateway share one origin, so no CORS is configured.
# /api/ goes to the gateway public port; everything else goes to the SPA. /q/* is never published:
# the operational endpoints stay on the gateway management port 9000.
server {
  listen 8080;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://souscription-gateway:8080;
  set $web http://souscription-web:8080;

  location /q/ {
    return 404;
  }

  location /api/ {
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass $web;
    proxy_set_header Host $host;
  }
}
