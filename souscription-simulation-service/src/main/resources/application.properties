quarkus.application.name=souscription-simulation-service
quarkus.http.port=${SIM_HTTP_PORT:8080}
quarkus.http.root-path=/
quarkus.shutdown.timeout=20S
quarkus.http.limits.max-body-size=16K
# --- capacity / thread model (wave 4) ---
# The projection is CPU-bound (up to 360 DECIMAL128 iterations) and runs on a worker
# thread (@Blocking on SimulationResource.compute), never on the Vert.x event loop.
# These two keys make any event-loop violation observable instead of silent.
quarkus.vertx.max-event-loop-execute-time=2S
quarkus.vertx.warning-exception-time=2S
# Worker pool and connection ceiling: every limit is externalised with a default,
# no bare hardcoded capacity. Sizing justified by SimulationThroughputTest (see README).
quarkus.thread-pool.core-threads=${SIM_CORE_THREADS:8}
quarkus.thread-pool.max-threads=${SIM_MAX_THREADS:16}
quarkus.thread-pool.queue-size=${SIM_QUEUE_SIZE:64}
quarkus.http.limits.max-connections=${SIM_MAX_CONNECTIONS:200}
quarkus.log.console.json=true
quarkus.smallrye-openapi.path=/q/openapi
# --- transport security (wave 6, W6-T01) ---
# What was an in-process method call now crosses the network: the only thing that
# authenticates the caller is its workload certificate. Values come from the two frozen
# contracts in global/contracts/*-to-souscription-simulation-service/security-policy.json
# (TLS 1.3 only, mutual, two cipher suites); the contract wins on any divergence.
# Certificate, key and CA paths are NEVER in the repository or in the image: they are
# mounted secrets whose paths arrive through the environment. Without the PKI the service
# must stay out of production traffic - plaintext HTTP is not an acceptable fallback,
# hence insecure-requests=disabled with no plaintext listener at all.
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=disabled
quarkus.http.ssl.certificate.files=${TLS_CERT_PATH}
quarkus.http.ssl.certificate.key-files=${TLS_KEY_PATH}
quarkus.http.ssl.certificate.trust-store-file=${TLS_CA_PATH}
quarkus.http.ssl.client-auth=required
quarkus.http.ssl.protocols=TLSv1.3
quarkus.http.ssl.cipher-suites=TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256
# No browser origin is ever involved (cluster-internal call, same-origin topology for the
# SPA and the gateway): cross-origin support stays off and no allow-origin is configured.
quarkus.http.cors=false
# Workload-identity allow-list. The PKI trusts every workload of the cluster, so trusting
# the CA alone would grant access to all of them: WorkloadIdentityFilter additionally
# requires the peer certificate to carry one of the SPIFFE identities contracted below.
# Seeded from acceptedSubjects / allowedCallerIdentities in the two security policies.
simulation.mtls.accepted-identities=spiffe://horizon-souscription/ns/horizon/sa/souscription-gateway,spiffe://horizon-souscription/ns/horizon/sa/souscription-service
# Rate limiting per calling workload identity (W6-T04). Values come from the rateLimiting
# block of both frozen security policies (100 req/s, burst 200, 429 problem+json on
# excess). Enforced in process by RateLimitFilter because this topology has no service
# mesh; move it to the mesh and these two keys become the mesh policy, unchanged.
# Externalised with the contract value as default so a load-measurement campaign can
# raise the ceiling (SIM_RATE_LIMIT_RPS) without touching the code or the contract.
simulation.ratelimit.requests-per-second=${SIM_RATE_LIMIT_RPS:100}
simulation.ratelimit.burst=${SIM_RATE_LIMIT_BURST:200}
# The default test instance drives thousands of requests through one application, well above
# 100 req/s, so the contracted ceiling would throttle suites that measure something else. The
# limiter is therefore effectively off in the shared test instance and exercised at its
# contracted figures by FaultInjectionTest, which pins 100/200 in its own profile and
# cross-checks them against the frozen security policies.
%test.simulation.ratelimit.requests-per-second=1000000
%test.simulation.ratelimit.burst=1000000
# The browser-facing request forgery control, the HTTP-method allow-list and the five
# security response headers are NOT implemented here: they stay at souscription-gateway
# (see README, "Concerns owned elsewhere"). A second implementation would diverge from
# the gateway's on the first change.
# Dev and test present the throwaway certificates generated by .ci/generate-dev-certs.sh
# at build time, outside the module tree. The transport is identical to production
# (TLS 1.3, client-auth required): the suites exercise the real transport, they never
# fall back to plaintext.
%dev.quarkus.http.ssl.certificate.files=../target/dev-certs/server-cert.pem
%dev.quarkus.http.ssl.certificate.key-files=../target/dev-certs/server-key.pem
%dev.quarkus.http.ssl.certificate.trust-store-file=../target/dev-certs/client-ca.pem
%test.quarkus.http.ssl.certificate.files=../target/dev-certs/server-cert.pem
%test.quarkus.http.ssl.certificate.key-files=../target/dev-certs/server-key.pem
%test.quarkus.http.ssl.certificate.trust-store-file=../target/dev-certs/client-ca.pem
# --- operational endpoints (wave 5) ---
# Les sondes vivent sur un port de management séparé du port de trafic : /q/health/live,
# /q/health/ready et /q/health/started ne sont jamais joignables depuis l'extérieur du
# cluster (le port 9000 n'est pas publié par le Service, plan 24).
quarkus.management.enabled=true
quarkus.management.port=${SIM_MANAGEMENT_PORT:9000}
# En test, les profils Quarkus redémarrent l'application dans la même JVM ; un port de
# management fixe entre alors en conflit avec l'interface de l'instance précédente encore
# en fermeture. Port éphémère en test uniquement, résolu par @TestHTTPResource.
quarkus.management.test-port=0
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-health.management.enabled=true
# Le document OpenAPI est servi sur l'interface de management (W5-T06) : son chemin
# /q/openapi reste figé par l'étape openapi-contract-diff, mais n'est plus joignable
# depuis l'extérieur du cluster. Les consommateurs (souscription-gateway et
# souscription-service) récupèrent l'artefact de pipeline, pas l'endpoint.
quarkus.smallrye-openapi.management.enabled=true
# Swagger UI est une surface non authentifiée : jamais servie hors dev et test.
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true
%test.quarkus.swagger-ui.always-include=true
# --- métriques Micrometer / Prometheus (W5-T02) ---
# Le scrape vit sur le port de management (quarkus.management.enabled ci-dessus) : /q/metrics
# n'est donc pas joignable depuis l'extérieur du cluster.
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.jvm=true
# --- tracing (wave 5, W5-T03) ---
# Le collecteur n'est jamais codé en dur : l'endpoint vient de l'environnement, la valeur par
# défaut ne sert qu'au poste de développement.
quarkus.otel.enabled=true
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_TRACES_SAMPLE_RATIO:0.1}
quarkus.otel.service.name=souscription-simulation-service
# Le ratio ci-dessus ne s'applique qu'aux traces réussies : ErrorBiasedSampler dégrade le rejet
# en record-only et ErrorBiasedSpanProcessor exporte 100 % des spans terminés en erreur.
# En test, aucun collecteur n'écoute : l'export OTLP est coupé et les spans sont lus via
# l'exporteur en mémoire (InMemorySpanExporter), sinon chaque test journalise un
# « Connection refused » vers 4317.
%test.quarkus.otel.exporter.otlp.enabled=false
# En test, le ratio des succès est mis à 0 : TracePropagationTest peut alors distinguer, dans
# une seule instance, le parent échantillonné (honoré), le succès sans parent (non exporté) et
# l'erreur (exportée malgré le ratio).
%test.quarkus.otel.traces.sampler.arg=0
# Délai d'export du batch processor réduit en test : sinon chaque assertion sur un span attend
# le planning par défaut (5 s).
%test.quarkus.otel.bsp.schedule.delay=100ms
# Decimal arithmetic contract: BigDecimal is always serialised in plain notation,
# never in scientific notation (1.0E+2), so the wire values stay byte-identical to
# the legacy JSP rendering. Locked by DecimalContractTest.
# Quarkus 3.20 has no native property of this name, so it logs "Unrecognized
# configuration key ... will be ignored" at startup: that warning is expected and
# wrong here. The key is read by BigDecimalSerializationCustomizer (@ConfigProperty)
# and applied to the ObjectMapper as SerializationFeature.WRITE_BIGDECIMAL_AS_PLAIN.
quarkus.jackson.write-bigdecimal-as-plain=true
# Document identity: must match info.version of the frozen contracts in global/contracts
# (stage openapi-contract-diff) and the published artefact name.
mp.openapi.extensions.smallrye.info.title=Horizon Simulation Service Internal API
mp.openapi.extensions.smallrye.info.version=1.0.0
# Always generate target/openapi.yaml at build time so the pipeline can diff it.
quarkus.smallrye-openapi.store-schema-directory=target
# No persistence configuration at all: this service stores nothing; the store and the
# subscription draft are owned by souscription-service (AG-009, FG-019)
# No HTTP session properties: the service is stateless (CFG-010, AG-011)
# Validation must precede capacity (W4-T03 parity): an invalid body is a deterministic 400,
# never a 503, even while the bulkhead is saturated. The fault-tolerance interceptor defaults
# to priority 4010, ahead of the method-validation interceptor (PLATFORM_AFTER + 800 = 4800),
# so the bulkhead permit would be requested before the constraints are evaluated. Raising it
# above the validation interceptor restores the source's load-independent validation verdicts.
mp.fault.tolerance.interceptor.priority=5000
