<div class="utility"><span>{{ labels.utilityExtranet }}</span><span>{{ labels.utilityService }}</span></div>
<header class="masthead">
  <div class="brand"><span class="brand-mark" aria-hidden="true">{{ labels.brandMark }}</span><div><strong>{{ labels.brandName }}</strong><span>{{ labels.brandBaseline }}</span></div></div>
  <div class="space-title">{{ labels.spaceTitle }}<br><span>{{ labels.spaceSubtitle }}</span></div>
</header>
<nav class="tabs" [attr.aria-label]="labels.mainNavLabel">
  <a routerLink="/catalogue" [class.selected]="step() === 1">{{ labels.navCatalogue }}</a>
  <span [class.selected]="step() > 1">{{ labels.navSubscription }}</span>
</nav>
