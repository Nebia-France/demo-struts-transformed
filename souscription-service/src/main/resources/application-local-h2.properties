# Profil local H2 utilise uniquement par persistence/LocalH2MigrationTest pour verifier que
# les migrations Flyway versionnees restent applicables sur H2. Aucun identifiant n'est
# porte par ce fichier (NFG-004) : la base est une base memoire jetable et le test genere
# un couple utilisateur / mot de passe ephemere a chaque execution.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:souscription;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
quarkus.datasource.devservices.enabled=false
quarkus.flyway.locations=db/migration,db/local-h2
quarkus.flyway.migrate-at-start=true
