# Configuration Quarkus - souscription-gateway
# (placeholder, renseigne par le plan 03)

# Journalisation unifiee (W0-T07)
quarkus.log.level=INFO
quarkus.log.category."fr.demo.souscription.gateway".level=DEBUG

# Journal JSON correle, sans donnee personnelle (W6-T03) - voir docs/observability.md
# Un enregistrement JSON par ligne sur la console, dans tous les profils : la forme du journal ne
# depend pas de l'environnement et LogHygieneTest verifie celle qui part en production.
# Le gestionnaire asynchrone est obligatoire : un gestionnaire synchrone bloque la boucle
# d'evenements sous un flux de journal soutenu (contrainte du plan 22). La file est bornee.
quarkus.log.console.json=true
quarkus.log.console.async=true
quarkus.log.console.async.queue-length=1024
quarkus.log.console.json.additional-field."service".value=souscription-gateway
# traceId / spanId (OpenTelemetry, plan 28) et requestId (meme valeur que le membre instance du Problem)
# sont garantis sur chaque enregistrement, vides hors requete ou tant que le SDK est inactif.
quarkus.log.console.filter=correlation-fields

# Traces distribuees (W6-T04) - voir docs/observability.md section 9
# La passerelle porte le span racine : elle adopte le traceparent W3C recu de la SPA, ou cree la
# racine s'il est absent, et le propage sans changer l'identite de trace aux trois clients REST.
# Aucun hote de collecteur par defaut : OTEL_COLLECTOR_ENDPOINT vient de l'environnement.
# Levier de retour arriere (CFG-012) : QUARKUS_OTEL_SDK_DISABLED=true a l'execution, ou
# quarkus.otel.enabled=false au build, si le tracage degrade la latence.
quarkus.otel.enabled=true
quarkus.otel.sdk.disabled=false
quarkus.otel.exporter.otlp.endpoint=${OTEL_COLLECTOR_ENDPOINT}
# Ratio uniforme applique aux racines. Le bean ErrorAwareSampler lit ces deux cles ; les traces en
# erreur sont toujours conservees par ErrorTraceRetainer, quel que soit le ratio.
quarkus.otel.traces.sampler=parentbased_traceidratio
quarkus.otel.traces.sampler.arg=${OTEL_SAMPLE_RATIO:0.1}
quarkus.otel.resource.attributes=service.name=souscription-gateway
# Pas d'instrumentation de la couche REST : elle attache au span serveur toute exception de
# validation ou de desserialisation, dont le message cite le champ, voire la valeur rejetee. Le span
# serveur Vert.x, les spans de parcours (@WithSpan) et les spans clients REST restent instrumentes ;
# SpanAttributeHygiene y pose la route gabarit.
quarkus.otel.instrument.rest=false
# La suite de tests ne depend d'aucun collecteur ; TracingTest reactive le SDK par son profil.
%test.quarkus.otel.sdk.disabled=true
%dev.quarkus.otel.sdk.disabled=true

# Descripteurs de deploiement externalises (W0-T05)
quarkus.http.port=8080
quarkus.http.root-path=/
quarkus.http.body.default-charset=UTF-8
quarkus.management.enabled=true
quarkus.management.port=9000
# Sondes et arret gracieux (W6-T01) - voir docs/operational-cost.md
# /q/health/live et /q/health/ready ne sont servis que sur l'interface de management (9000) ; le
# port public 8080 ne les expose pas et l'ingress partage ne publie jamais /q/*.
# Au SIGTERM, Quarkus refuse les nouvelles requetes (503) et attend la fin des requetes en vol
# pendant au plus 10 s : valeur superieure au plus long delai de lecture aval (5000 ms,
# subscription), sans quoi une confirmation en vol serait coupee.
quarkus.shutdown.timeout=10s
gateway.csrf.cookie-name=${CSRF_COOKIE_NAME:XSRF-TOKEN}
gateway.csrf.header-name=${CSRF_HEADER_NAME:X-CSRF-Token}
gateway.csrf.max-token-length=${CSRF_MAX_LEN:100}
# Duree de vie bornee du jeton, equivalente a la fenetre de session de 20 minutes de la source.
gateway.csrf.ttl=${CSRF_TTL:PT20M}
# Aucune valeur par defaut : le secret vient de l'environnement / du coffre, et son absence doit
# faire echouer le demarrage (W3-T02).
gateway.csrf.signing-key=${CSRF_SIGNING_KEY}
gateway.security.csp=${GATEWAY_CSP:default-src 'none'; frame-ancestors 'none'; base-uri 'none'}
gateway.security.allowed-methods=${GATEWAY_ALLOWED_METHODS:GET,HEAD,POST,PUT}
# Base des types de probleme RFC 7807 ; externalisee pour qu'aucune URI absolue ne figure dans les sources.
problem.type-base=${PROBLEM_TYPE_BASE:https://example.com/horizon-souscription/problems/}

# Bornes de la surface d'entree JSON (W1-T05)
# Aucune route n'accepte de corps volumineux : le plus gros corps du contrat (SimulationRequest)
# pese quelques centaines d'octets. Un depassement renvoie 413.
quarkus.http.limits.max-body-size=64K
quarkus.http.limits.max-header-size=8K
quarkus.http.limits.max-form-attribute-size=2K
quarkus.http.so-reuse-port=false
# Politique d'origine : SPA et gateway sont servis par le meme ingress (meme origine, OD-004),
# donc aucune configuration CORS n'est ajoutee. Voir docs/edge-filters.md.

%dev.quarkus.http.port=18080
# Port de test aleatoire : un port fixe (8081 par defaut, puis 18581) est partage avec les autres
# JVM du poste ou de l'agent de build (autre build concurrent, passerelle packagee de la gate
# Cucumber liee sur 0.0.0.0) ; une requete de test peut alors etre servie par une autre instance
# et le resultat de la suite depend de ce qui tourne a cote (W5-T04). Quarkus publie le port
# effectivement lie dans quarkus.http.test-port, lu par REST Assured.
quarkus.http.test-port=0
# Meme raison pour l'interface de management. Les tests lisent quarkus.management.test-port
# (port effectif publie au demarrage) pour joindre /q/openapi et /q/metrics.
quarkus.management.test-port=0

# Metriques et SLI de disponibilite 99,9 % (W6-T02) - voir docs/observability.md
# /q/metrics est servi par l'interface de management (9000) uniquement : le port public 8080 repond
# 404 et l'ingress partage ne publie jamais /q/*. Les URI sont des gabarits : aucun code produit,
# identifiant de brouillon ou cle de confirmation ne devient une valeur d'etiquette.
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.http-client.enabled=true
quarkus.micrometer.binder.jvm=true
# Les motifs sont evalues dans l'ordre, le premier qui correspond gagne, et ils priment sur le gabarit
# JAX-RS : chaque sous-ressource de brouillon a donc son propre motif, place avant /drafts/{id}. Le
# dernier motif regroupe sous /unmatched tout chemin hors des routes publiques (requete rejetee par
# un filtre d'arete avant tout routage, chemin inconnu) : sans lui, une rafale de chemins aleatoires
# creerait autant de series que de chemins. /q/* en est exclu : ces URI non applicatives restent
# ecartees par Micrometer (suppress-non-application-uris) et ne polluent pas le SLI.
quarkus.micrometer.binder.http-server.match-patterns=\
  /api/v1/products/.+=/api/v1/products/{code},\
  /api/v1/drafts/[^/]+/subscriber=/api/v1/drafts/{id}/subscriber,\
  /api/v1/drafts/[^/]+/simulation=/api/v1/drafts/{id}/simulation,\
  /api/v1/drafts/[^/]+/confirmation=/api/v1/drafts/{id}/confirmation,\
  /api/v1/drafts/.+=/api/v1/drafts/{id},\
  /api/v1/subscriptions/.+=/api/v1/subscriptions/{key},\
  /(?!api/v1/(products|drafts|simulations|csrf-token)$|q/).*=/unmatched

# Format de serialisation deterministe (W1-T02)
# fail-on-unknown-properties=true est volontaire : reduction de la surface d'abus (NFG-006)
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.serialization-inclusion=non-null

# Packaging et image conteneur (W0-T06) - mode JVM uniquement, pas de natif (TQ-093)
quarkus.package.jar.type=fast-jar
quarkus.native.enabled=false
quarkus.container-image.build=false
quarkus.container-image.name=souscription-gateway

# Contrat OpenAPI public /api/v1 publie sur /q/openapi (W1-T03)
# L'interface de management etant active (port 9000), /q/openapi est servi sur celle-ci :
# le document reste joignable en interne et n'est pas expose via l'ingress public.
quarkus.smallrye-openapi.path=/q/openapi
quarkus.smallrye-openapi.management.enabled=true
quarkus.smallrye-openapi.info-title=Horizon Souscription Public API
quarkus.smallrye-openapi.info-version=1.0.0
# Ecrit target/openapi.yaml au build : artefact versionne archive par la CI.
quarkus.smallrye-openapi.store-schema-directory=target
# Swagger UI uniquement en profil dev : pas de surface d'exploration en prod.
quarkus.swagger-ui.always-include=false
%dev.quarkus.swagger-ui.always-include=true

# Clients REST aval (W4-T01) - une arete par contrat consomme de global/contracts/.
# Aucune URI ni delai n'est code en Java : la bascule vers un vrai fournisseur est un simple
# changement d'environnement (voir docs/downstream-clients.md).
quarkus.rest-client.catalogue.url=${CATALOGUE_BASE_URI}
quarkus.rest-client.catalogue.connect-timeout=500
quarkus.rest-client.catalogue.read-timeout=3000
quarkus.rest-client.simulation.url=${SIMULATION_BASE_URI}
quarkus.rest-client.simulation.connect-timeout=500
quarkus.rest-client.simulation.read-timeout=3000
quarkus.rest-client.subscription.url=${SUBSCRIPTION_BASE_URI}
quarkus.rest-client.subscription.connect-timeout=500
# 5s : le budget couvre la lecture du produit, la simulation distante et l'ecriture.
quarkus.rest-client.subscription.read-timeout=5000

# mTLS sortant (W4-T03) - voir docs/mtls.md
# Le materiel (keystore client + truststore de la CA interne) est monte en lecture seule par le
# secret souscription-gateway-mtls sur /etc/gateway/tls (deploy/deployment.yaml). Les chemins et
# mots de passe ne sont resolus qu'en profil prod : aucun fichier .p12 n'est versionne et la suite
# de tests utilise du materiel auto-signe genere sous target/ (MtlsTest).
# verify-host reste actif dans tous les profils : le desactiver "pour debloquer le dev" est la
# regression la plus courante et doit etre refusee en revue (MtlsTest la verrouille).
%prod.quarkus.rest-client.catalogue.key-store=file:/etc/gateway/tls/keystore.p12
%prod.quarkus.rest-client.catalogue.key-store-password=${TLS_KEYSTORE_PASSWORD}
%prod.quarkus.rest-client.catalogue.trust-store=file:/etc/gateway/tls/truststore.p12
%prod.quarkus.rest-client.catalogue.trust-store-password=${TLS_TRUSTSTORE_PASSWORD}
quarkus.rest-client.catalogue.verify-host=true
%prod.quarkus.rest-client.simulation.key-store=file:/etc/gateway/tls/keystore.p12
%prod.quarkus.rest-client.simulation.key-store-password=${TLS_KEYSTORE_PASSWORD}
%prod.quarkus.rest-client.simulation.trust-store=file:/etc/gateway/tls/truststore.p12
%prod.quarkus.rest-client.simulation.trust-store-password=${TLS_TRUSTSTORE_PASSWORD}
quarkus.rest-client.simulation.verify-host=true
%prod.quarkus.rest-client.subscription.key-store=file:/etc/gateway/tls/keystore.p12
%prod.quarkus.rest-client.subscription.key-store-password=${TLS_KEYSTORE_PASSWORD}
%prod.quarkus.rest-client.subscription.trust-store=file:/etc/gateway/tls/truststore.p12
%prod.quarkus.rest-client.subscription.trust-store-password=${TLS_TRUSTSTORE_PASSWORD}
quarkus.rest-client.subscription.verify-host=true

# Dimensionnement des pools et de la concurrence (W4-T04) - voir docs/capacity.md
# Chaque taille est dimensionnee face a la capacite declaree de l'aval, afin que la passerelle ne
# puisse pas amplifier la charge sur une dependance saine. La protection de l'aval repose sur le
# bulkhead de la passerelle (plan 23), jamais sur une file d'attente non bornee.
# keep-alive amortit le cout de la poignee de main TLS (reprise de session incluse).
quarkus.rest-client.catalogue.connection-pool-size=${CATALOGUE_POOL:50}
quarkus.rest-client.catalogue.keep-alive-enabled=true
quarkus.rest-client.simulation.connection-pool-size=${SIMULATION_POOL:50}
quarkus.rest-client.simulation.keep-alive-enabled=true
quarkus.rest-client.subscription.connection-pool-size=${SUBSCRIPTION_POOL:30}
quarkus.rest-client.subscription.keep-alive-enabled=true
quarkus.http.limits.max-connections=${MAX_INBOUND_CONNECTIONS:1000}

# Modele d'execution non bloquant (W5-T02) - voir docs/execution-model.md
# Aucun code de la passerelle ne bloque la boucle d'evenements ; ces seuils rendent une
# regression visible dans le journal sous la forme "Thread ... has been blocked for N ms".
# Critere NFG-009 : 0 avertissement sous la charge de reference, seuil de detection 2000 ms.
quarkus.vertx.max-event-loop-execute-time=2S
quarkus.vertx.warning-exception-time=2S
%test.quarkus.vertx.max-event-loop-execute-time=2S
%test.quarkus.vertx.warning-exception-time=2S

# Politiques de tolerance aux pannes par arete (W5-T01) - voir docs/resilience-policies.md
# Les annotations des beans *Gateway portent les valeurs par defaut ; chaque seuil est redeclare ici
# pour qu'il soit relachable par variable d'environnement, sans redeploiement de code. Supprimer un
# delai d'attente n'est jamais une solution de repli acceptable : seule sa valeur est ajustable.
fr.demo.souscription.gateway.client.CatalogueGateway/list/Timeout/value=${CATALOGUE_TIMEOUT_MS:3000}
fr.demo.souscription.gateway.client.CatalogueGateway/list/Retry/maxRetries=${CATALOGUE_RETRIES:2}
fr.demo.souscription.gateway.client.CatalogueGateway/detail/Timeout/value=${CATALOGUE_TIMEOUT_MS:3000}
fr.demo.souscription.gateway.client.CatalogueGateway/detail/Retry/maxRetries=${CATALOGUE_RETRIES:2}
fr.demo.souscription.gateway.client.CatalogueGateway/CircuitBreaker/requestVolumeThreshold=${CATALOGUE_CB_VOLUME:20}
fr.demo.souscription.gateway.client.CatalogueGateway/CircuitBreaker/failureRatio=${CATALOGUE_CB_RATIO:0.5}
fr.demo.souscription.gateway.client.CatalogueGateway/CircuitBreaker/delay=${CATALOGUE_CB_DELAY_MS:10000}
fr.demo.souscription.gateway.client.SimulationGateway/compute/Timeout/value=${SIMULATION_TIMEOUT_MS:3000}
fr.demo.souscription.gateway.client.SimulationGateway/compute/Retry/maxRetries=${SIMULATION_RETRIES:1}
fr.demo.souscription.gateway.client.SimulationGateway/CircuitBreaker/requestVolumeThreshold=${SIMULATION_CB_VOLUME:20}
fr.demo.souscription.gateway.client.SimulationGateway/CircuitBreaker/failureRatio=${SIMULATION_CB_RATIO:0.5}
fr.demo.souscription.gateway.client.SimulationGateway/CircuitBreaker/delay=${SIMULATION_CB_DELAY_MS:10000}
fr.demo.souscription.gateway.client.SubscriptionGateway/startDraft/Timeout/value=${SUBSCRIPTION_TIMEOUT_MS:5000}
fr.demo.souscription.gateway.client.SubscriptionGateway/getDraft/Timeout/value=${SUBSCRIPTION_TIMEOUT_MS:5000}
fr.demo.souscription.gateway.client.SubscriptionGateway/getDraft/Retry/maxRetries=${SUBSCRIPTION_READ_RETRIES:1}
fr.demo.souscription.gateway.client.SubscriptionGateway/putSubscriber/Timeout/value=${SUBSCRIPTION_TIMEOUT_MS:5000}
fr.demo.souscription.gateway.client.SubscriptionGateway/putSimulation/Timeout/value=${SUBSCRIPTION_TIMEOUT_MS:5000}
# Confirmation : seul le delai est configurable. Aucune cle /Retry/ n'existe pour cette methode, et
# en ajouter une serait sans effet, aucun @Retry n'etant declare (plan 18 / plan 21, etape 3).
fr.demo.souscription.gateway.client.SubscriptionGateway/confirm/Timeout/value=${SUBSCRIPTION_TIMEOUT_MS:5000}
fr.demo.souscription.gateway.client.SubscriptionGateway/getSubscription/Timeout/value=${SUBSCRIPTION_TIMEOUT_MS:5000}
fr.demo.souscription.gateway.client.SubscriptionGateway/getSubscription/Retry/maxRetries=${SUBSCRIPTION_READ_RETRIES:1}
fr.demo.souscription.gateway.client.SubscriptionGateway/CircuitBreaker/requestVolumeThreshold=${SUBSCRIPTION_CB_VOLUME:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/CircuitBreaker/failureRatio=${SUBSCRIPTION_CB_RATIO:0.5}
fr.demo.souscription.gateway.client.SubscriptionGateway/CircuitBreaker/delay=${SUBSCRIPTION_CB_DELAY_MS:10000}

# Cloisonnement par dependance (W5-T03) - voir docs/latency-budget.md
# Un @Bulkhead par methode de passerelle borne la concurrence que la passerelle s'autorise sur
# chaque arete : un aval lent ne peut pas consommer toute la capacite de la passerelle ni affamer
# les deux autres dependances. La protection de l'aval vient du bulkhead, jamais d'une file
# d'attente non bornee : au-dela de value + waitingTaskQueue, l'appel est refuse immediatement
# (BulkheadException -> 503 + Retry-After).
fr.demo.souscription.gateway.client.CatalogueGateway/list/Bulkhead/value=${CATALOGUE_BULKHEAD:20}
fr.demo.souscription.gateway.client.CatalogueGateway/list/Bulkhead/waitingTaskQueue=${CATALOGUE_BULKHEAD_QUEUE:20}
fr.demo.souscription.gateway.client.CatalogueGateway/detail/Bulkhead/value=${CATALOGUE_BULKHEAD:20}
fr.demo.souscription.gateway.client.CatalogueGateway/detail/Bulkhead/waitingTaskQueue=${CATALOGUE_BULKHEAD_QUEUE:20}
fr.demo.souscription.gateway.client.SimulationGateway/compute/Bulkhead/value=${SIMULATION_BULKHEAD:20}
fr.demo.souscription.gateway.client.SimulationGateway/compute/Bulkhead/waitingTaskQueue=${SIMULATION_BULKHEAD_QUEUE:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/startDraft/Bulkhead/value=${SUBSCRIPTION_BULKHEAD:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/startDraft/Bulkhead/waitingTaskQueue=${SUBSCRIPTION_BULKHEAD_QUEUE:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/getDraft/Bulkhead/value=${SUBSCRIPTION_BULKHEAD:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/getDraft/Bulkhead/waitingTaskQueue=${SUBSCRIPTION_BULKHEAD_QUEUE:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/putSubscriber/Bulkhead/value=${SUBSCRIPTION_BULKHEAD:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/putSubscriber/Bulkhead/waitingTaskQueue=${SUBSCRIPTION_BULKHEAD_QUEUE:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/putSimulation/Bulkhead/value=${SUBSCRIPTION_BULKHEAD:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/putSimulation/Bulkhead/waitingTaskQueue=${SUBSCRIPTION_BULKHEAD_QUEUE:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/confirm/Bulkhead/value=${SUBSCRIPTION_BULKHEAD:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/confirm/Bulkhead/waitingTaskQueue=${SUBSCRIPTION_BULKHEAD_QUEUE:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/getSubscription/Bulkhead/value=${SUBSCRIPTION_BULKHEAD:20}
fr.demo.souscription.gateway.client.SubscriptionGateway/getSubscription/Bulkhead/waitingTaskQueue=${SUBSCRIPTION_BULKHEAD_QUEUE:20}
