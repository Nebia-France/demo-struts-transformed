#
# References de secrets de souscription-service (W7-T04).
#
# Ce fichier ne contient AUCUNE valeur : uniquement les references aux cles du
# gestionnaire de secrets, consommees par le Deployment. Les valeurs sont posees par la
# plateforme (Kubernetes Secret alimente par le gestionnaire de secrets, ou CSI / External
# Secrets) et ne transitent ni par le depot ni par l'image.
#
# Les trois identifiants de base de donnees n'ont aucune valeur par defaut dans
# application.properties (NFG-004) : un demarrage sans ces variables echoue, il ne retombe
# jamais sur un identifiant en dur.
#
# Cles attendues :
#   horizon-souscription-service-db   -> HORIZON_DB_URL, HORIZON_DB_USER, HORIZON_DB_PASSWORD
#   horizon-souscription-service-mesh -> WORKLOAD_CERT, WORKLOAD_KEY, CLUSTER_CA
#   horizon-souscription-service-otel -> OTEL_EXPORTER_OTLP_ENDPOINT
#
# Politiques reseau : ce fichier ne redefinit rien. L'isolation reseau et l'identite de
# transport restent portees par les manifestes du plan 29, references ici sans duplication :
#   deploy/network-policy.yaml       (entree limitee a souscription-gateway, sortie fermee)
#   deploy/authorization-policy.yaml (PeerAuthentication STRICT, identites SPIFFE)
#
# Chiffrement au repos (W7-T07, ecart CFG-011) : la base designee par HORIZON_DB_URL heberge
# subscriptions.subscription_draft, qui contient des donnees a caractere personnel. L'instance
# doit etre chiffree au repos au niveau du volume (chiffrement de disque de la plateforme, cle
# geree par le gestionnaire de cles du cloud provider). Le chiffrement en transit est impose
# cote client par quarkus.datasource.jdbc.additional-jdbc-properties.sslmode=require. Le
# mecanisme retenu et le registre des traitements sont consignes dans COMPLIANCE_RGPD.md, dont
# la ligne de validation DPO est bloquante pour la mise en service.
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: souscription-service
  labels:
    app.kubernetes.io/name: souscription-service
spec:
  template:
    spec:
      containers:
        - name: souscription-service
          env:
            - name: HORIZON_DB_URL
              valueFrom:
                secretKeyRef:
                  name: horizon-souscription-service-db
                  key: HORIZON_DB_URL
            - name: HORIZON_DB_USER
              valueFrom:
                secretKeyRef:
                  name: horizon-souscription-service-db
                  key: HORIZON_DB_USER
            - name: HORIZON_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: horizon-souscription-service-db
                  key: HORIZON_DB_PASSWORD
            # Materiel X.509 de maillage : emis et rotate automatiquement par la PKI du
            # cluster, jamais present dans le depot ni dans l'image.
            - name: WORKLOAD_CERT
              valueFrom:
                secretKeyRef:
                  name: horizon-souscription-service-mesh
                  key: WORKLOAD_CERT
            - name: WORKLOAD_KEY
              valueFrom:
                secretKeyRef:
                  name: horizon-souscription-service-mesh
                  key: WORKLOAD_KEY
            - name: CLUSTER_CA
              valueFrom:
                secretKeyRef:
                  name: horizon-souscription-service-mesh
                  key: CLUSTER_CA
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: horizon-souscription-service-otel
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
