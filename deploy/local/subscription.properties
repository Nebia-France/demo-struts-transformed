quarkus.datasource.jdbc.additional-jdbc-properties.sslmode=disable
quarkus.rest-client.catalogue.tls-configuration-name=mesh
quarkus.rest-client.simulation.tls-configuration-name=mesh
quarkus.tls.mesh.key-store.pem.0.cert=/pki/souscription-service.crt
quarkus.tls.mesh.key-store.pem.0.key=/pki/souscription-service.key
quarkus.tls.mesh.trust-store.pem.certs=/pki/ca.crt
quarkus.tls.mesh.protocols=TLSv1.3
quarkus.tls.mesh.hostname-verification-algorithm=HTTPS
