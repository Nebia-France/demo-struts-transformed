openapi: 3.1.0
info:
  title: Horizon Souscription Public API
  version: 1.0.0
  description: |
    Public contract between the Angular SPA (souscription-web) and the API gateway
    (souscription-gateway). It replaces the eight legacy `*.do` Struts front-controller
    actions; the `*.do` paths are explicitly not a preserved contract.

    This document is the single source of truth from which souscription-web generates its
    TypeScript models (IG-005). The gateway aggregates the catalogue, simulation and
    subscription services and never holds business logic of its own.

    Conventions:
      * Monetary amounts and the product annual rate are JSON strings so BigDecimal scales
        (DECIMAL(14,2) amounts, DECIMAL(8,6) rate) survive the wire unchanged.
      * Dates are ISO-8601; the SPA renders fr_FR dd/MM/yyyy and fr_FR number formats.
      * Errors use RFC 7807 `application/problem+json`, with a `errors` array for field errors.
      * No authentication exists (preserved from the source). State-changing requests require
        the double-submit CSRF token (OD-006).
      * SPA and gateway are served from the same origin behind a shared ingress (OD-004),
        so no CORS configuration is part of this contract.
  contact:
    name: Horizon Souscription platform team
    url: https://example.com/horizon-souscription
servers:
  - url: https://dev.horizon-souscription.example.com/api/v1
    description: Development (same origin as the SPA)
  - url: https://staging.horizon-souscription.example.com/api/v1
    description: Staging (same origin as the SPA)
  - url: https://horizon-souscription.example.com/api/v1
    description: Production (same origin as the SPA)
tags:
  - name: catalogue
    description: Product catalogue reads, proxied to souscription-catalogue-service.
  - name: simulation
    description: Compound-interest projection, proxied to souscription-simulation-service.
  - name: subscription
    description: Subscription draft and confirmation, proxied to souscription-service.
  - name: security
    description: CSRF token issuance at the edge.
paths:
  /csrf-token:
    get:
      tags: [security]
      operationId: issueCsrfToken
      summary: Issue a CSRF token for the double-submit cookie scheme
      description: |
        Sets the `XSRF-TOKEN` cookie (Secure, SameSite=Strict, not HttpOnly so the SPA can read it)
        and returns the same value in the body. The SPA must echo it in the `X-CSRF-Token` header
        on every state-changing request. Replaces the session-bound token of the legacy hidden form field.
      responses:
        '200':
          description: Token issued.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: 'XSRF-TOKEN=<token>; Path=/; Secure; SameSite=Strict'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token]
                properties:
                  token: { type: string, minLength: 32 }
        '500': { $ref: '#/components/responses/InternalError' }
  /products:
    get:
      tags: [catalogue]
      operationId: listProducts
      summary: List the savings products
      description: |
        Returns the full catalogue. The collection is three static products, so no pagination is
        defined; adding pagination later would be a breaking change and requires a new major version.
      responses:
        '200':
          description: The catalogue.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductSummary' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DownstreamUnavailable' }
  /products/{code}:
    parameters:
      - $ref: '#/components/parameters/ProductCode'
    get:
      tags: [catalogue]
      operationId: getProduct
      summary: Get one product by code
      responses:
        '200':
          description: The product.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DownstreamUnavailable' }
  /simulations:
    post:
      tags: [simulation]
      operationId: simulate
      summary: Project the capital for a product and a set of amounts
      description: |
        The gateway resolves the product's annual rate from the catalogue and forwards the
        computation to souscription-simulation-service. The client never supplies a rate.
        This is a safe, side-effect-free computation exposed as POST because the inputs are a body.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productCode, initialAmount, monthlyAmount, durationYears]
              properties:
                productCode: { $ref: '#/components/schemas/ProductSummary/properties/code' }
                initialAmount: { $ref: '#/components/schemas/SimulationInput/properties/initialAmount' }
                monthlyAmount: { $ref: '#/components/schemas/SimulationInput/properties/monthlyAmount' }
                durationYears: { $ref: '#/components/schemas/SimulationInput/properties/durationYears' }
      responses:
        '200':
          description: The projection.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DownstreamUnavailable' }
  /drafts:
    post:
      tags: [subscription]
      operationId: startDraft
      summary: Start a subscription draft for a product (wizard step 1)
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [productCode]
              properties:
                productCode: { $ref: '#/components/schemas/ProductSummary/properties/code' }
      responses:
        '201':
          description: Draft created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftView' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DownstreamUnavailable' }
  /drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      tags: [subscription]
      operationId: getDraft
      summary: Read the current draft (wizard summary, step 4)
      responses:
        '200':
          description: The draft.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DownstreamUnavailable' }
  /drafts/{draftId}/subscriber:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    put:
      tags: [subscription]
      operationId: putDraftSubscriber
      summary: Capture or replace the subscriber of the draft (wizard step 2)
      description: |
        Idempotent replacement of the subscriber block. Changing the subscriber rotates the
        draft's `confirmationKey`, matching the legacy Draft behaviour.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriberInput' }
      responses:
        '200':
          description: Subscriber captured; the updated draft is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftView' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DownstreamUnavailable' }
  /drafts/{draftId}/simulation:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    put:
      tags: [subscription]
      operationId: putDraftSimulation
      summary: Attach the chosen simulation to the draft (wizard step 3)
      description: |
        The amounts are revalidated and the projection recomputed server-side from the product's
        annual rate; the client-supplied result is never stored. Changing the simulation rotates
        the draft's `confirmationKey`.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationInput' }
      responses:
        '200':
          description: Simulation attached; the updated draft is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftView' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DownstreamUnavailable' }
  /drafts/{draftId}/confirmation:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [subscription]
      operationId: confirmDraft
      summary: Confirm the draft and create the subscription (wizard step 5)
      description: |
        Idempotent on `confirmationKey`: the first call returns 201 with a new reference, any replay
        of the same key returns 200 with the same reference and creates no second subscription
        (preserved from the unique `confirmation_key` constraint). The gateway performs no automatic
        retry, so a client-driven re-submission after a timeout is the supported recovery path.
      security:
        - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmationRequest' }
      responses:
        '201':
          description: Subscription created.
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionConfirmation' }
        '200':
          description: Replay of an already-confirmed key; the same subscription is returned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionConfirmation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '403': { $ref: '#/components/responses/CsrfRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The draft is incomplete (no subscriber or no simulation) or the supplied
            `confirmationKey` no longer matches the draft.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/FieldErrors' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DownstreamUnavailable' }
  /subscriptions/{reference}:
    parameters:
      - name: reference
        in: path
        required: true
        schema: { type: string, maxLength: 36 }
    get:
      tags: [subscription]
      operationId: getSubscription
      summary: Read a confirmed subscription
      responses:
        '200':
          description: The subscription.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheControl' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionConfirmation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/DownstreamUnavailable' }
components:
  securitySchemes:
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        Double-submit CSRF token (OD-006). The value must equal the `XSRF-TOKEN` cookie issued by
        `GET /csrf-token`. Required on POST, PUT, PATCH and DELETE; ignored on GET and HEAD.
        This is not authentication: the API is anonymous, exactly as the source application was.
  parameters:
    ProductCode:
      name: code
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProductSummary/properties/code' }
    DraftId:
      name: draftId
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    CacheControl:
      schema: { type: string, default: 'no-store' }
      description: 'The gateway sets `Cache-Control: no-store` on every JSON response.'
  responses:
    ValidationFailed:
      description: |
        Field validation failed. The field errors produced by souscription-service or
        souscription-simulation-service are propagated unchanged by the gateway.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/FieldErrors' }
    CsrfRejected:
      description: Missing or mismatched CSRF token, or a disallowed HTTP method.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/FieldErrors' }
    NotFound:
      description: Unknown product code, draft id or subscription reference.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/FieldErrors' }
    Conflict:
      description: The request conflicts with the current state of the draft.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/FieldErrors' }
    InternalError:
      description: Unexpected server error. No internal detail is leaked to the browser.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/FieldErrors' }
    DownstreamUnavailable:
      description: |
        A downstream service is unavailable or its circuit breaker is open. Retryable from the
        client; the gateway performs no automatic retry towards the subscription service.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/FieldErrors' }
  schemas:
    ProductSummary:
      $ref: '../shared-schemas/ProductSummary.json'
    ProductDetail:
      $ref: '../shared-schemas/ProductDetail.json'
    SubscriberInput:
      $ref: '../shared-schemas/SubscriberInput.json'
    SimulationInput:
      $ref: '../shared-schemas/SimulationInput.json'
    SimulationResult:
      $ref: '../shared-schemas/SimulationResult.json'
    DraftView:
      $ref: '../shared-schemas/DraftView.json'
    ConfirmationRequest:
      $ref: '../shared-schemas/ConfirmationRequest.json'
    SubscriptionConfirmation:
      $ref: '../shared-schemas/SubscriptionConfirmation.json'
    FieldErrors:
      $ref: '../shared-schemas/FieldErrors.json'
