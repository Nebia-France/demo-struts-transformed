# Gherkin suite configuration.
#
# Feature selection is owned by RunCucumberTest, which selects the
# repository-root features tree at ../features/simulation (relative to this
# module), i.e. the single shared features/ copy - never a copy inside the
# module. Setting cucumber.features here instead would make the Cucumber engine
# discover those scenarios a second time, outside the suite, including during
# the default (non -Pcucumber) gate.
cucumber.glue=features.step_definitions
# Scope guard: this module answers only for the 10 declared simulation
# scenarios. The remaining 78 scenarios belong to souscription-web,
# souscription-gateway, souscription-service and souscription-catalogue-service.
cucumber.filter.tags=@simulation
cucumber.plugin=pretty,html:target/cucumber-report.html
